on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: Android Build u

jobs:
  create-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: ./client/packages/android/app/open-msupply-2.7.00-release.apk
