on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: Android Build

jobs:
  create-android-build:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: ./client/packages/android/app/Screenshot 2025-04-09 at 15.00.55.png
